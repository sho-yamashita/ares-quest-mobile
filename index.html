  :root { --blue:#0D3B85; --blue-soft:#DCE9FF; --gold:#B88216; --gold-soft:#FFF4E5; --green:#1B5E3A; --green-soft:#E7F5EC; --line:#DDE3EE; --muted:#8A93A5; --ink:#1c2330; --bg:#f4f6fa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); }
  .appbar { background:var(--blue); color:#fff; padding:6px 14px 12px; display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .logo { width:26px; height:26px; border-radius:50%; background:var(--gold); color:#fff; font-weight:800; font-size:11px; display:grid; place-items:center; flex:0 0 auto; }
  .appbar b { font-size:15px; }
  .sync { margin-left:auto; font-size:10px; background:rgba(255,255,255,.18); padding:3px 8px; border-radius:10px; white-space:nowrap; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .card h3 { margin:0 0 6px; font-size:14px; }
  .small { font-size:12px; color:var(--muted); line-height:1.6; }
  .bar { height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin:8px 0 6px; }
  .bar i { display:block; height:100%; background:var(--green); width:40%; }
  .btn { display:block; width:100%; border:0; border-radius:10px; padding:13px; font-size:14px; font-weight:700; background:var(--blue); color:#fff; margin:8px 0 0; text-align:center; }
  .btn.sub { background:#fff; color:var(--blue); border:1px solid var(--blue); }
  .btn.gold { background:var(--gold-soft); color:#8A5A00; border:1px solid #F2D9AE; font-size:13px; padding:10px; }
  .field { display:block; width:100%; margin:4px 0 10px; padding:10px; font-size:14px; border:1px solid var(--line); border-radius:8px; }
  .link { color:var(--blue); font-size:13px; margin:0 0 8px; display:block; }
  .tabs { display:flex; margin:10px 0 8px; }
  .tabs span { flex:1; text-align:center; padding:8px; font-size:13px; border:1px solid var(--line); background:#fff; }
  .tabs span.on { background:var(--blue-soft); color:var(--blue); font-weight:700; }
  .sec { font-size:13px; font-weight:700; margin:12px 0 6px; }
  .item { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px; }
  .item .t { font-size:14px; display:flex; gap:6px; align-items:center; }
  .badge { font-size:10px; padding:2px 7px; border-radius:8px; font-weight:700; flex:0 0 auto; }
  .b-new { background:var(--blue-soft); color:var(--blue); } .b-weak { background:var(--gold-soft); color:#8A5A00; } .b-rev { background:var(--green-soft); color:var(--green); }
  .chip { display:inline-block; font-size:11px; background:var(--blue-soft); color:var(--blue); padding:3px 9px; border-radius:10px; margin:0 6px 8px 0; }
  .chip.g { background:var(--green-soft); color:var(--green); }
  .stepper { display:flex; gap:4px; overflow-x:auto; margin:0 0 10px; }
  .stepper span { font-size:12px; padding:6px 10px; border-radius:14px; background:#fff; border:1px solid var(--line); white-space:nowrap; }
  .stepper span.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .hero { background:var(--blue-soft); border-left:4px solid var(--blue); border-radius:8px; padding:10px 12px; margin-bottom:10px; font-size:13px; line-height:1.7; }
  .q { font-size:14px; line-height:1.7; margin-bottom:10px; }
  .choice { display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:7px; font-size:14px; line-height:1.5; }
  .choice.ok { border-color:var(--green); background:var(--green-soft); } .choice.ng { border-color:#C98A1A; background:var(--gold-soft); }
  .res { font-weight:800; margin:4px 0 8px; } .res.ok { color:var(--green); } .res.ng { color:#8A5A00; }
  .expl { background:#fff; border-left:4px solid var(--gold); padding:10px 12px; font-size:13px; line-height:1.7; border-radius:6px; margin-bottom:8px; }
  .expl .lab { font-size:11px; color:#8A5A00; font-weight:700; margin-bottom:4px; }
  .official { background:#fff; border:1px dashed var(--muted); padding:10px 12px; font-size:13px; line-height:1.7; border-radius:8px; margin-bottom:8px; }
  .warn { background:var(--gold-soft); border:1px solid #F2D9AE; color:#8A5A00; border-radius:10px; padding:8px 10px; font-size:12px; margin-bottom:10px; line-height:1.6; }
  .pc { background:#fff; border:1px dashed var(--muted); border-radius:10px; padding:10px 12px; font-size:12px; color:#55607a; margin-top:10px; line-height:1.6; }
  .point { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px; font-size:13px; line-height:1.6; }
  .point b { display:block; margin-bottom:2px; }

  /* 実機では端末の枠を描かず画面全体を使う(モックの .phone / .body の代わり) */
  .phone { min-height:100vh; display:flex; flex-direction:column; background:var(--bg); }
  .body { flex:1; padding:12px; max-width:640px; width:100%; margin:0 auto; }
  button { font-family:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .link { background:none; border:0; padding:0; text-align:left; }
  .tabs button { flex:1; text-align:center; padding:8px; font-size:13px; border:1px solid var(--line); background:#fff; }
  .tabs button.on { background:var(--blue-soft); color:var(--blue); font-weight:700; }
  .item.tap { width:100%; text-align:left; display:block; font-family:inherit; }
  .md p, .md ul, .md ol { margin:0 0 6px; }
  .md table { border-collapse:collapse; } .md th, .md td { border:1px solid var(--line); padding:3px 6px; }
  .md pre { white-space:pre-wrap; }
  textarea.copybox { width:100%; min-height:140px; font-size:12px; }
  /* ページ画像: 枠の中でスクロールでき、ブラウザ標準のピンチ拡大を使う(独自ジェスチャーは持たない) */
  .pagebox { overflow:auto; touch-action:pinch-zoom pan-x pan-y; border:1px solid var(--line); border-radius:8px; background:#fff; max-height:75vh; }
  .pagebox img { display:block; max-width:100%; height:auto; }
